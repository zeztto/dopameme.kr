name: dopameme-kr

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dopameme-kr-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: dopameme-kr-migrate
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: dopameme-kr-seed
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:seed"]

  postgres:
    image: postgres:16-alpine
    container_name: dopameme-kr-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - dopameme_kr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dopameme_kr_pgdata:
